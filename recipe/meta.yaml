{% set name = "mpl-probscale" %}
{% set version = "0.2.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/matplotlib/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 34774f6560ba178adbc1ef10635e6e825bac46120fb2285622298e061f8c8016

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: True  # [py<38]

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy
    - matplotlib-base

test:
  requires:
    - pip
    # Upstream 0.2.5 tests use nose-style setup() and pytest.warns(None); pin <8
    # until mpl-probscale updates tests for pytest 8+.
    - pytest >=7,<8
  source_files:
    - probscale/tests/
  imports:
    - probscale
  commands:
    - pip check
    # - pytest -v --pyargs probscale
    - pytest -v probscale/tests/

about:
  home: http://matplotlib.org/mpl-probscale
  summary: Real probability scales for matplotlib
  description: |
    Real probability scales for matplotlib
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/matplotlib/mpl-probscale
  doc_url: https://matplotlib.org/mpl-probscale

extra:
  recipe-maintainers:
    - phobson
